[project]
name = "regrag-backend"
version = "0.1.0"
description = "RegRag backend — API, agent, ingestion, evals"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi[standard]>=0.139",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-json-logger>=3.3",
    "sqlalchemy[asyncio]>=2.0",
]

[project.scripts]
ingest = "app.ingestion.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
    "ty>=0.0.1a24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["app", "tests"]

[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
