[project]
name = "regrag-backend"
version = "0.1.0"
description = "RegRag backend — API, agent, ingestion, evals"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "boto3>=1.43.67",
    "fastapi[standard]>=0.139",
    "httpx>=0.28",
    "langchain-litellm>=0.2",
    "langgraph>=1.0",
    "litellm>=1.79",
    "openai>=1.0",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-json-logger>=3.3",
    "selectolax>=0.4.11",
    "sqlalchemy[asyncio]>=2.0",
    "sse-starlette>=2.1",
    "tenacity>=9.1",
]

[project.scripts]
ingest = "app.ingestion.cli:main"
retrieve = "app.retrieval.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.16",
    "ty>=0.0.1a24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["app", "tests"]

[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]
