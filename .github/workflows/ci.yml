name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm knip

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm build

  smoke-stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      COMPOSE_ENV_FILES: .env.prod
    steps:
      - uses: actions/checkout@v7

      - name: Assert the prod overlay does not publish Postgres
        run: |
          cp .env.example .env.prod
          docker compose config --format json \
            | jq -e '(.services.db.ports // []) == []' > /dev/null \
            || { echo "Postgres is published in the prod overlay"; exit 1; }

      - name: Start the stack
        run: |
          docker compose run --build --rm api alembic upgrade head
          docker compose up -d --wait --wait-timeout 120

      - name: Verify HTTPS health through Caddy
        run: |
          body=$(curl -fsk --retry 20 --retry-all-errors --retry-delay 3 https://localhost/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/)
          test "$code" = "404" || { echo "expected 404 at /, got $code"; exit 1; }

      - name: Verify the docs resolve the spec URL they advertise
        run: |
          spec=$(curl -fsk https://localhost/api/docs | sed -n "s/.*url: '\([^']*\)'.*/\1/p" | head -1)
          echo "docs advertise: $spec"
          test "$spec" = "/api/openapi.json" || { echo "expected /api/openapi.json"; exit 1; }
          curl -fsk -o /dev/null "https://localhost$spec"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color
