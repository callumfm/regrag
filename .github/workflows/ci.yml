name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: regrag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d regrag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run pytest

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm knip

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm build

  smoke-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert the prod overlay does not publish Postgres
        run: |
          cp .env.example .env.prod
          count=$(docker compose --env-file .env.prod \
            -f compose.yaml -f compose.prod.yaml config --format json \
            | python3 -c "import json,sys; print(len(json.load(sys.stdin)['services']['db'].get('ports') or []))")
          test "$count" -eq 0 || { echo "Postgres is published in the prod overlay"; exit 1; }

      - name: Start the stack
        run: |
          docker compose --env-file .env.prod \
            -f compose.yaml -f compose.prod.yaml up -d --build db
          docker compose --env-file .env.prod \
            -f compose.yaml -f compose.prod.yaml run --rm api alembic upgrade head
          docker compose --env-file .env.prod \
            -f compose.yaml -f compose.prod.yaml up -d

      - name: Verify HTTPS health through Caddy
        run: |
          body=$(curl -fsk --retry 20 --retry-all-errors --retry-delay 3 https://localhost/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"database":"ok"'

      - name: Verify Postgres is not reachable from the host
        run: |
          nc -z localhost 5432 && { echo "Postgres is exposed"; exit 1; } || echo "not published, as expected"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.prod \
            -f compose.yaml -f compose.prod.yaml ps
          docker compose --env-file .env.prod \
            -f compose.yaml -f compose.prod.yaml logs --no-color
