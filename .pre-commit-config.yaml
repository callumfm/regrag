repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        language: system
        entry: pnpm --dir frontend exec biome check --write src
        pass_filenames: false
        files: ^frontend/
